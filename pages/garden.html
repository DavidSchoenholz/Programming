<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Garden</title>
<link rel="stylesheet" href="../css/base.css">
<style>
  :root { --bg: #fbf8f1; --fg: #2d2a24; --muted: #8b8478; --card: #fffdf8; --border: #ebe4d6; --accent: #4f7c4a; --link: #b5602b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171712; --fg: #ebe7dc; --muted: #9a9384; --card: #1f1f19; --border: #2f2e26; --accent: #9fcf8f; --link: #e6a06a; }
  }
  body { background: var(--bg); color: var(--fg); }
  main { max-width: 980px; margin: 0 auto; padding: 80px 16px 120px; }
  h1 { font-family: Georgia, serif; font-weight: 400; font-size: clamp(34px, 6vw, 54px); margin: 0 0 8px; }
  .lead { color: var(--muted); max-width: 560px; margin: 0 0 28px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
  .chip { border: 1px solid var(--border); background: var(--card); color: var(--fg); border-radius: 999px; padding: 5px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card { display: block; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; text-decoration: none; color: inherit; transition: transform 200ms, box-shadow 200ms; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(60, 40, 10, 0.08); }
  .card h3 { font-family: Georgia, serif; font-weight: 400; font-size: 21px; margin: 8px 0; line-height: 1.2; }
  .card p { color: var(--muted); font-size: 14px; margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--muted); }
  .stage { display: inline-flex; align-items: center; gap: 5px; color: var(--accent); text-transform: capitalize; }
  .stage svg { width: 16px; height: 16px; }
  .tags { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tags span { font-size: 12px; color: var(--muted); }
  .tags span::before { content: "#"; opacity: 0.6; }
  article { max-width: 640px; margin: 0 auto; }
  article h1 { margin-top: 16px; }
  article .body { font-family: Georgia, serif; font-size: 19px; line-height: 1.65; }
  article .body a { color: var(--link); text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .back { color: var(--muted); text-decoration: none; font-size: 14px; }
  .backlinks { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--border); }
  .backlinks h4 { margin: 0 0 12px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 600; }
  .backlinks .grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 20px; }
</style>
</head>
<body>
<nav class="sketch-nav"><a href="../index.html">← all sketches</a><span>after Maggie Appleton</span></nav>
<main id="app"></main>
<script src="../js/notes.js"></script>
<script>
const ICONS = {
  seedling: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 21v-8"/><path d="M12 13c0-3 2-5 5-5 0 3-2 5-5 5z"/><path d="M4 21h16"/></svg>`,
  budding: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 21V9"/><path d="M12 14c0-3-2-5-5-5 0 3 2 5 5 5z"/><path d="M12 11c0-3 2-5 5-5 0 3-2 5-5 5z"/><circle cx="12" cy="6" r="2"/><path d="M4 21h16"/></svg>`,
  evergreen: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l5 7h-3l4 6H6l4-6H7z"/><path d="M12 16v5"/><path d="M4 21h16"/></svg>`,
};
const STAGES = ["seedling", "budding", "evergreen"];
const stageBadge = (s) => `<span class="stage">${ICONS[s]}${s}</span>`;
const fmtDate = (d) => new Date(d + "T00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
const excerpt = (b) => b.replace(/\[\[([a-z0-9-]+)(?:\|([^\]]+))?\]\]/g, (_, id, l) => l || NOTE_BY_ID[id]?.title || id).split("\n")[0];
const card = (n) => `<a class="card" href="#${n.id}">
  <div class="meta">${stageBadge(n.stage)}<span>${fmtDate(n.updated)}</span></div>
  <h3>${n.title}</h3><p>${excerpt(n.body)}</p>
  <div class="tags">${n.tags.map((t) => `<span>${t}</span>`).join("")}</div></a>`;

const filter = { stage: null, tag: null };
const app = document.getElementById("app");

function list() {
  const tags = [...new Set(NOTES.flatMap((n) => n.tags))].sort();
  const shown = NOTES.filter((n) => (!filter.stage || n.stage === filter.stage) && (!filter.tag || n.tags.includes(filter.tag)))
    .sort((a, b) => b.updated.localeCompare(a.updated));
  app.innerHTML = `
    <h1>The Garden</h1>
    <p class="lead">A collection of notes in various states of growth. Seedlings are rough ideas, budding notes are being worked on, evergreens are as finished as anything gets.</p>
    <div class="legend">${STAGES.map((s) => `${stageBadge(s)} ${NOTES.filter((n) => n.stage === s).length}`).join("")}</div>
    <div class="filters">
      ${STAGES.map((s) => `<button class="chip ${filter.stage === s ? "on" : ""}" data-stage="${s}">${ICONS[s].replace("<svg", '<svg width="14" height="14"')}${s}</button>`).join("")}
      ${tags.map((t) => `<button class="chip ${filter.tag === t ? "on" : ""}" data-tag="${t}">#${t}</button>`).join("")}
    </div>
    <div class="grid">${shown.map(card).join("") || "<p>Nothing growing here yet.</p>"}</div>`;
  app.querySelectorAll("[data-stage]").forEach((b) => b.onclick = () => { filter.stage = filter.stage === b.dataset.stage ? null : b.dataset.stage; list(); });
  app.querySelectorAll("[data-tag]").forEach((b) => b.onclick = () => { filter.tag = filter.tag === b.dataset.tag ? null : b.dataset.tag; list(); });
}

function note(n) {
  const back = noteLinks().filter(([, to]) => to === n.id).map(([from]) => NOTE_BY_ID[from]);
  const uniq = [...new Map(back.map((b) => [b.id, b])).values()];
  app.innerHTML = `<article>
    <a class="back" href="#">← the garden</a>
    <h1>${n.title}</h1>
    <div class="meta">${stageBadge(n.stage)}<span>last tended ${fmtDate(n.updated)}</span></div>
    <div class="body">${renderNoteBody(n.body)}</div>
    <div class="tags">${n.tags.map((t) => `<span>${t}</span>`).join("")}</div>
    <section class="backlinks"><h4>Linked from</h4><div class="grid">${uniq.map(card).join("") || "<p class='meta'>Nothing links here yet.</p>"}</div></section>
  </article>`;
}

function route() {
  const id = location.hash.slice(1);
  NOTE_BY_ID[id] ? note(NOTE_BY_ID[id]) : list();
  scrollTo(0, 0);
}
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
